<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Luminary — Ask Anything</title>
  <style>
    :root {
      --bg: #0D121E;
      --surface: #141B2D;
      --surface-low: #111828;
      --surface-mid: #192236;
      --surface-high: #222D45;
      --surface-variant: #1E273D;
      --primary: #F5B041;
      --on-primary: #2B1900;
      --primary-container: #3A290E;
      --on-primary-container: #FFDFA6;
      --tertiary: #7FD1DC;
      --tertiary-container: #163D44;
      --on-tertiary-container: #B6EFF6;
      --text: #F4EFE6;
      --text-muted: #A7B0C4;
      --outline: #3B465F;
      --outline-variant: #252F45;
      --error: #FFB4AB;
      --error-container: #690005;
      --on-error-container: #FFDAD6;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --font-display: Georgia, "Playfair Display", "Times New Roman", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", Inter, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    html[data-theme="light"] {
      --bg: #FAF8F4;
      --surface: #FFFFFF;
      --surface-low: #F6F3EC;
      --surface-mid: #EFECE4;
      --surface-high: #E7E2D6;
      --surface-variant: #F1EDE4;
      --primary: #141B2D;
      --on-primary: #FFFAF0;
      --primary-container: #E2E7F4;
      --on-primary-container: #141B2D;
      --tertiary: #B8730D;
      --tertiary-container: #FCECD2;
      --on-tertiary-container: #3E2400;
      --text: #141824;
      --text-muted: #565E70;
      --outline: #C5C0B5;
      --outline-variant: #E2DDD2;
      --error: #BA1A1A;
      --error-container: #FFDAD6;
      --on-error-container: #410002;
      --shadow: 0 8px 24px rgba(20, 27, 45, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .app-shell {
      display: flex;
      height: 100dvh;
      width: 100%;
      background: var(--bg);
      position: relative;
    }

    /* Sidebar / Drawer */
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.62);
      z-index: 40;
      backdrop-filter: blur(2px);
    }

    .drawer-backdrop.open {
      display: block;
    }

    .sidebar {
      width: 296px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--outline-variant);
      display: flex;
      flex-direction: column;
      padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
      gap: 12px;
      z-index: 50;
      transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @media (max-width: 839px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-105%);
        box-shadow: var(--shadow);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }

    .btn-primary-full {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      background: var(--primary);
      color: var(--on-primary);
      font-weight: 600;
      font-size: 0.94rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary-full:active {
      opacity: 0.88;
    }

    .saved-shortcut {
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      background: var(--surface-low);
      border: 1px solid var(--outline-variant);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .saved-shortcut-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .count-pill {
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--tertiary-container);
      color: var(--on-tertiary-container);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .divider {
      height: 1px;
      background: var(--outline-variant);
      width: 100%;
    }

    .sidebar-section-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 4px;
      letter-spacing: 0.02em;
    }

    .thread-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .thread-empty {
      padding: 28px 12px;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }

    .thread-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 4px 6px 12px;
      border-radius: 12px;
      min-height: 48px;
      cursor: pointer;
    }

    .thread-item:hover {
      background: var(--surface-low);
    }

    .thread-item.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .thread-meta {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .thread-title {
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .thread-item.active .thread-title {
      font-weight: 600;
    }

    .thread-date {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
      position: relative;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    html[data-theme="light"] .icon-btn:hover {
      background: rgba(20, 27, 45, 0.06);
    }

    .icon-btn.accent {
      color: var(--tertiary);
    }

    .icon-btn-sm {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    /* Main Column & Atmospheric Backgrounds */
    .main-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    .main-column > *:not(.bg-backdrop) {
      position: relative;
      z-index: 1;
    }

    .bg-backdrop {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, background 0.35s ease;
    }

    html[data-bg="ambient"] .bg-backdrop {
      background:
        radial-gradient(60% 45% at 86% 10%, rgba(127, 209, 220, 0.14), transparent 70%),
        radial-gradient(65% 50% at 14% 48%, rgba(245, 176, 65, 0.11), transparent 72%),
        radial-gradient(50% 45% at 72% 88%, rgba(127, 209, 220, 0.08), transparent 70%);
    }
    html[data-theme="light"][data-bg="ambient"] .bg-backdrop {
      background:
        radial-gradient(60% 45% at 86% 10%, rgba(184, 115, 13, 0.10), transparent 70%),
        radial-gradient(65% 50% at 14% 48%, rgba(20, 27, 45, 0.07), transparent 72%),
        radial-gradient(50% 45% at 72% 88%, rgba(184, 115, 13, 0.06), transparent 70%);
    }

    html[data-bg="nebula"] .bg-backdrop {
      background:
        radial-gradient(55% 40% at 78% 18%, rgba(245, 176, 65, 0.22), transparent 68%),
        radial-gradient(65% 55% at 22% 35%, rgba(45, 92, 168, 0.30), transparent 70%),
        radial-gradient(50% 45% at 62% 82%, rgba(127, 209, 220, 0.18), transparent 72%),
        linear-gradient(160deg, rgba(10, 14, 26, 0.45), rgba(18, 26, 48, 0.25));
    }
    html[data-theme="light"][data-bg="nebula"] .bg-backdrop {
      background:
        radial-gradient(55% 40% at 78% 18%, rgba(245, 176, 65, 0.16), transparent 68%),
        radial-gradient(65% 55% at 22% 35%, rgba(65, 112, 188, 0.14), transparent 70%),
        radial-gradient(50% 45% at 62% 82%, rgba(127, 209, 220, 0.14), transparent 72%);
    }

    html[data-bg="aurora"] .bg-backdrop {
      background:
        radial-gradient(75% 40% at 30% 14%, rgba(67, 198, 172, 0.22), transparent 68%),
        radial-gradient(70% 45% at 75% 42%, rgba(92, 107, 192, 0.22), transparent 72%),
        radial-gradient(65% 42% at 35% 84%, rgba(127, 209, 220, 0.16), transparent 70%);
    }
    html[data-theme="light"][data-bg="aurora"] .bg-backdrop {
      background:
        radial-gradient(75% 40% at 30% 14%, rgba(46, 168, 152, 0.14), transparent 68%),
        radial-gradient(70% 45% at 75% 42%, rgba(92, 107, 192, 0.12), transparent 72%),
        radial-gradient(65% 42% at 35% 84%, rgba(67, 198, 172, 0.10), transparent 70%);
    }

    html[data-bg="minimal"] .bg-backdrop {
      background: none;
    }

    .top-bar {
      height: calc(60px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 8px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
    }

    @media (min-width: 840px) {
      #menuBtn {
        display: none;
      }
    }

    .app-title {
      font-family: var(--font-display);
      font-size: 1.42rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    @media (min-width: 840px) {
      .app-title {
        position: static;
        transform: none;
        margin-left: 16px;
      }
    }

    .key-dot {
      position: absolute;
      top: 11px;
      right: 11px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    .key-dot.missing {
      background: #FF6B6B;
    }

    /* Scrollable Content Area */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 18px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content-inner {
      width: 100%;
      max-width: 740px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Hero Card */
    .hero-card {
      position: relative;
      height: 184px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--outline-variant);
      background: #0D121E;
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .hero-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(13, 18, 30, 0.15) 0%, rgba(13, 18, 30, 0.84) 100%);
      pointer-events: none;
    }

    .hero-text {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hero-text h1 {
      font-family: var(--font-display);
      font-size: 2.15rem;
      line-height: 1.12;
      font-weight: 600;
      color: #FFFAF0;
      letter-spacing: -0.02em;
    }

    .hero-text p {
      font-size: 0.89rem;
      line-height: 1.45;
      color: #D9E1F0;
      max-width: 560px;
    }

    /* Mode Selector */
    .section-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .mode-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .mode-row::-webkit-scrollbar {
      display: none;
    }

    .mode-pill {
      min-height: 40px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--surface-low);
      border: 1px solid var(--outline-variant);
      color: var(--text-muted);
      font-size: 0.86rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .mode-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary);
    }

    /* Starter Prompts */
    .starter-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .starter-card {
      width: 100%;
      text-align: left;
      background: rgba(20, 27, 45, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--outline-variant);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }

    .starter-card:hover {
      border-color: var(--outline);
    }

    .starter-card:active {
      transform: scale(0.99);
    }

    .starter-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .category-badge {
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--tertiary-container);
      color: var(--on-tertiary-container);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .starter-mode-tag {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .starter-title {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
    }

    /* Chat Messages */
    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .user-row {
      display: flex;
      justify-content: flex-end;
    }

    .user-bubble {
      max-width: min(86%, 560px);
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-radius: 20px 20px 6px 20px;
      padding: 12px 16px;
      font-size: 0.98rem;
      line-height: 1.5;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      gap: 10px;
      word-break: break-word;
    }

    .user-bubble img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 12px;
    }

    .ai-card {
      background: rgba(20, 27, 45, 0.90);
      backdrop-filter: blur(12px);
      border: 1px solid var(--outline-variant);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    html[data-theme="light"] .starter-card,
    html[data-theme="light"] .ai-card,
    html[data-theme="light"] .studio-card {
      background: rgba(255, 255, 255, 0.90);
    }

    /* Grok / DeepSeek Reasoning Accordion */
    .thought-card {
      background: var(--surface-low);
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      overflow: hidden;
    }
    .thought-summary {
      list-style: none;
      cursor: pointer;
      min-height: 44px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      user-select: none;
    }
    .thought-summary::-webkit-details-marker {
      display: none;
    }
    .thought-summary-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .thought-summary.active-thinking {
      color: var(--tertiary);
    }
    .thought-chevron {
      transition: transform 0.18s ease;
    }
    .thought-card[open] .thought-chevron {
      transform: rotate(180deg);
    }
    .thought-body {
      border-top: 1px solid var(--outline-variant);
      padding: 10px 12px 12px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .ai-card.streaming {
      border-color: rgba(127, 209, 220, 0.55);
    }

    .ai-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ai-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--tertiary-container);
      color: var(--tertiary);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .ai-avatar.pulse {
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .ai-name {
      font-size: 0.88rem;
      font-weight: 600;
    }

    .ai-name.streaming-label {
      color: var(--tertiary);
    }

    .mode-badge {
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--surface-low);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .skeleton-lines {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .skeleton-bar {
      height: 14px;
      border-radius: 7px;
      background: var(--surface-high);
      animation: pulse 1.2s ease-in-out infinite;
    }

    /* Markdown Styling */
    .md-body {
      font-size: 0.98rem;
      line-height: 1.6;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 10px;
      word-break: break-word;
    }

    .md-body h1 {
      font-family: var(--font-display);
      font-size: 1.38rem;
      margin-top: 4px;
    }

    .md-body h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .md-body h3 {
      font-size: 1.02rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .md-body ul, .md-body ol {
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .md-body li::marker {
      color: var(--tertiary);
      font-weight: 700;
    }

    .md-body blockquote {
      background: var(--surface-low);
      border-left: 3px solid var(--tertiary);
      border-radius: 0 10px 10px 0;
      padding: 10px 14px;
      color: var(--text-muted);
      font-style: italic;
    }

    .md-inline-code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--surface-high);
      color: var(--tertiary);
      padding: 2px 6px;
      border-radius: 5px;
    }

    .md-body a {
      color: var(--tertiary);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .code-card {
      background: var(--surface-high);
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      overflow: hidden;
    }

    .code-header {
      background: var(--surface-mid);
      padding: 4px 8px 4px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .code-card pre {
      padding: 14px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      line-height: 1.5;
      color: var(--text);
    }

    .md-divider {
      border: none;
      height: 1px;
      background: var(--outline-variant);
      margin: 4px 0;
    }

    .md-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      background: var(--surface-low);
    }

    .md-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
      line-height: 1.4;
    }

    .md-table th, .md-table td {
      padding: 9px 12px;
      text-align: left;
      border-bottom: 1px solid var(--outline-variant);
      vertical-align: top;
      min-width: 96px;
    }

    .md-table th {
      background: var(--surface-mid);
      font-weight: 700;
      color: var(--text);
    }

    .md-table tbody tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.025);
    }

    .md-table tbody tr:last-child td {
      border-bottom: none;
    }

    .ai-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
    }

    .ai-action-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .regen-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      color: var(--primary);
      font-size: 0.86rem;
      font-weight: 600;
      min-height: 40px;
    }

    .regen-btn:hover {
      background: rgba(245, 176, 65, 0.1);
    }

    /* Error Banner */
    .error-banner {
      background: var(--error-container);
      color: var(--on-error-container);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
    }

    .error-banner-text {
      flex: 1;
      line-height: 1.4;
    }

    .retry-btn {
      padding: 9px 14px;
      border-radius: 999px;
      background: #BA1A1A;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.84rem;
      flex-shrink: 0;
    }

    /* Follow-up Chips */
    .followup-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .followup-row::-webkit-scrollbar {
      display: none;
    }

    .followup-chip {
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--surface-low);
      border: 1px solid var(--outline-variant);
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .followup-chip:hover {
      border-color: var(--outline);
    }

    /* Bottom Composer */
    .composer-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }

    .composer {
      width: 100%;
      max-width: 780px;
      background: rgba(20, 27, 45, 0.93);
      backdrop-filter: blur(14px);
      border: 1px solid var(--outline-variant);
      border-bottom: none;
      border-radius: 24px 24px 0 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    html[data-theme="light"] .composer {
      background: rgba(255, 255, 255, 0.94);
    }

    .attachment-preview {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--outline-variant);
    }

    .attachment-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .attachment-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.72);
      color: #FFF;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .composer-input {
      flex: 1;
      background: var(--surface-low);
      border-radius: 20px;
      border: 1px solid transparent;
      padding: 12px 16px;
      font-size: 0.98rem;
      line-height: 1.4;
      resize: none;
      max-height: 132px;
      min-height: 48px;
      outline: none;
    }

    .composer-input:focus {
      border-color: var(--outline);
    }

    .composer-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--on-primary);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: opacity 0.15s ease;
    }

    .send-btn:disabled {
      background: var(--surface-high);
      color: var(--text-muted);
      cursor: default;
    }

    .send-btn.stop {
      background: var(--error-container);
      color: var(--on-error-container);
    }

    /* Saved View */
    .saved-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .saved-header h2 {
      font-family: var(--font-display);
      font-size: 1.6rem;
    }

    .saved-empty {
      padding: 72px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
    }

    /* Settings Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.72);
      z-index: 80;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(3px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow);
    }

    .modal-card h3 {
      font-family: var(--font-display);
      font-size: 1.45rem;
    }

    .modal-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .field-input {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      background: var(--surface-low);
      border: 1px solid var(--outline-variant);
      padding: 0 14px;
      font-size: 0.92rem;
      outline: none;
    }

    .field-input:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-ghost {
      height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn-save {
      height: 44px;
      padding: 0 20px;
      border-radius: 12px;
      background: var(--primary);
      color: var(--on-primary);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .camera-preview-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #080C15;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--outline-variant);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .camera-preview-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .camera-fallback-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      background: var(--primary);
      color: var(--on-primary);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .camera-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toast {
      position: fixed;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface-high);
      color: var(--text);
      border: 1px solid var(--outline);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 90;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden {
      display: none !important;
    }

    /* Compact Studio Dropdown Menu & Collapsible Composer Tools Panel */
    .studio-menu-wrap {
      position: relative;
    }

    .studio-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 224px;
      background: var(--surface-high);
      border: 1px solid var(--outline-variant);
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.34);
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .studio-dropdown-item {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 500;
      text-align: left;
      transition: background 0.14s ease;
    }
    .studio-dropdown-item:hover {
      background: var(--surface-variant);
    }
    .studio-dropdown-item.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-weight: 600;
    }
    .studio-dropdown-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tools-panel {
      background: var(--surface-low);
      border: 1px solid var(--outline-variant);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 2px;
    }
    .tools-section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .tools-divider {
      height: 1px;
      background: var(--outline-variant);
    }

    .grounding-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .grounding-row::-webkit-scrollbar { display: none; }

    .chip-toggle {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--outline-variant);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chip-toggle.active {
      background: var(--tertiary-container);
      color: var(--on-tertiary-container);
      border-color: transparent;
    }

    .studio-panel {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .studio-subtabs {
      display: flex;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 16px;
      padding: 5px;
    }
    .studio-subtab {
      flex: 1;
      min-height: 40px;
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .studio-subtab.active {
      background: var(--primary);
      color: var(--on-primary);
    }

    .studio-card {
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 22px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .studio-card h2 {
      font-family: var(--font-display);
      font-size: 1.35rem;
    }
    .studio-subtext {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .studio-textarea {
      width: 100%;
      min-height: 76px;
      border-radius: 14px;
      background: var(--surface-low);
      border: 1px solid var(--outline-variant);
      padding: 12px;
      font-size: 0.92rem;
      resize: vertical;
      outline: none;
    }
    .studio-textarea:focus {
      border-color: var(--primary);
    }
    .studio-textarea.mono {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      min-height: 120px;
    }
    .studio-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .studio-btn {
      min-height: 46px;
      padding: 0 18px;
      border-radius: 14px;
      background: var(--primary);
      color: var(--on-primary);
      font-weight: 600;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1;
    }
    .studio-btn.secondary {
      background: var(--surface-low);
      color: var(--text);
      border: 1px solid var(--outline-variant);
    }
    .studio-btn.danger {
      background: var(--error-container);
      color: var(--on-error-container);
    }
    .studio-btn:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .media-stage {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--outline-variant);
      background: #080C15;
    }
    .media-stage img, .media-stage video {
      width: 100%;
      max-height: 420px;
      display: block;
      object-fit: contain;
    }
    .three-frame {
      width: 100%;
      height: 340px;
      border: none;
      display: block;
      background: #0B101B;
    }

    .voice-orb-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
    }
    .voice-orb {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--primary-container);
      color: var(--on-primary-container);
      display: grid;
      place-items: center;
      transition: transform 0.3s ease, background 0.3s ease;
    }
    .voice-orb.live {
      background: var(--tertiary-container);
      color: var(--on-tertiary-container);
      animation: orbPulse 1.4s infinite ease-in-out;
    }
    @keyframes orbPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .sql-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
    }
    .sql-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }
    .sql-table th, .sql-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--outline-variant);
      text-align: left;
      white-space: nowrap;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sql-table th {
      background: var(--surface-variant);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="drawerBackdrop" class="drawer-backdrop"></div>

    <!-- Sidebar / History Drawer -->
    <aside id="sidebar" class="sidebar" aria-label="Conversation history">
      <button id="sidebarNewBtn" class="btn-primary-full" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/>
        </svg>
        <span>New question</span>
      </button>

      <button id="sidebarSavedBtn" class="saved-shortcut" type="button">
        <span class="saved-shortcut-left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--tertiary)" aria-hidden="true">
            <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
          </svg>
          <span>Saved Answers</span>
        </span>
        <span id="savedCountPill" class="count-pill">0</span>
      </button>

      <div class="divider"></div>
      <div class="sidebar-section-label">Recent Questions</div>
      <div id="threadList" class="thread-list"></div>
    </aside>

    <!-- Main Workspace -->
    <div class="main-column">
      <div id="bgBackdrop" class="bg-backdrop" aria-hidden="true"></div>
      <header class="top-bar">
        <div class="top-bar-left">
          <button id="backToChatBtn" class="icon-btn hidden" type="button" aria-label="Back to chat">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
            </svg>
          </button>
          <button id="menuBtn" class="icon-btn" type="button" aria-label="History">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <span id="appTitle" class="app-title">Luminary</span>
        </div>

        <div class="top-bar-right">
          <div class="studio-menu-wrap">
            <button id="studioMenuBtn" class="icon-btn" type="button" aria-label="Studios and tools">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                <rect x="14" y="14" width="7" height="7" rx="1.5"/>
              </svg>
            </button>
            <div id="studioDropdownMenu" class="studio-dropdown hidden" role="menu">
              <button class="studio-dropdown-item active" data-tab="CHAT" type="button">
                <span class="studio-dropdown-left">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  <span>Chatbot</span>
                </span>
              </button>
              <button class="studio-dropdown-item" data-tab="CREATE" type="button">
                <span class="studio-dropdown-left">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  <span>Images &amp; Video</span>
                </span>
              </button>
              <button class="studio-dropdown-item" data-tab="VOICE" type="button">
                <span class="studio-dropdown-left">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
                  <span>Voice &amp; Transcribe</span>
                </span>
              </button>
              <button class="studio-dropdown-item" data-tab="THREE_D" type="button">
                <span class="studio-dropdown-left">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/></svg>
                  <span>3D Scenes</span>
                </span>
              </button>
              <button class="studio-dropdown-item" data-tab="SQL" type="button">
                <span class="studio-dropdown-left">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                  <span>SQLite Database</span>
                </span>
              </button>
            </div>
          </div>
          <button id="apiKeyBtn" class="icon-btn" type="button" aria-label="AI Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
            </svg>
            <span id="keyStatusDot" class="key-dot missing"></span>
          </button>
          <button id="topSavedBtn" class="icon-btn" type="button" aria-label="Saved answers">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
          <button id="themeToggleBtn" class="icon-btn" type="button" aria-label="Switch appearance">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
          <button id="topNewBtn" class="icon-btn" type="button" aria-label="New question">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <main id="contentScroll" class="content-scroll">
        <div id="contentInner" class="content-inner"></div>
        <div id="studioView" class="studio-panel hidden"></div>
      </main>

      <div id="composerWrap" class="composer-wrap">
        <div class="composer">
          <div id="toolsPanel" class="tools-panel hidden">
            <div class="tools-section-label">Live Data</div>
            <div id="groundingRow" class="grounding-row">
              <button id="toggleSearchBtn" class="chip-toggle active" type="button">Web Search</button>
              <button id="toggleMapsBtn" class="chip-toggle active" type="button">Google Maps</button>
              <button id="toggleGpsBtn" class="chip-toggle" type="button">Use GPS</button>
            </div>
            <div class="tools-divider"></div>

      let audioCtx = null;
      function playSendSound() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          if (!audioCtx) audioCtx = new Ctx();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const now = audioCtx.currentTime;

          const playTone = (freq, start, dur, gainPeak) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(gainPeak, start + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + dur + 0.01);
          };

          playTone(659.25, now, 0.075, 0.14);
          playTone(987.77, now + 0.055, 0.11, 0.16);
        } catch {
          // Audio playback unavailable
        }
      }

      // Safe HTML escaping & Markdown Parser
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderInlineMarkdown(text) {
        const escaped = escapeHtml(text);
        const links = [];
        let out = escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi, (_, label, url) => {
          const idx = links.length;
          const cleanUrl = url.replace(/&amp;/g, "&");
          links.push(`<a href="${escapeHtml(cleanUrl)}" target="_blank" rel="noopener noreferrer">${label}</a>`);
          return `\u0000LNK${idx}\u0000`;
        });
        out = out.replace(/`([^`]+)`/g, '<code class="md-inline-code">$1</code>');
        out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        out = out.replace(/\u0000LNK(\d+)\u0000/g, (_, idx) => links[Number(idx)] || "");
        return out;
      }

      function parseTableCells(line) {
        let s = line.trim();
        if (s.startsWith("|")) s = s.slice(1);
        if (s.endsWith("|")) s = s.slice(0, -1);
        return s.split("|").map(c => c.trim());
      }

      function isTableSeparatorRow(line) {
        const t = line.trim();
        if (!t.includes("-")) return false;
        const cells = parseTableCells(t);
        return cells.length > 0 && cells.every(c => /^:?-{2,}:?$/.test(c));
      }

      function renderMarkdown(raw) {
        const lines = String(raw || "").replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let inCode = false;
        let codeLang = "";
        let codeLines = [];
        let listType = null;
        let listStart = 1;
        let listItems = [];
        let suspendedOlNext = 0;
        let paraLines = [];

        function flushPara() {
          if (paraLines.length) {
            html.push(`<p>${renderInlineMarkdown(paraLines.join(" "))}</p>`);
            paraLines = [];
          }
        }

        function flushList() {
          if (listItems.length) {
            const openTag = listType === "ol"
              ? (listStart !== 1 ? `<ol start="${listStart}">` : "<ol>")
              : "<ul>";
            const closeTag = listType === "ol" ? "</ol>" : "</ul>";
            html.push(`${openTag}${listItems.map(li => `<li>${renderInlineMarkdown(li)}</li>`).join("")}${closeTag}`);
            listItems = [];
            listType = null;
            listStart = 1;
          }
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const leadingSpaces = line.length - line.trimStart().length;
          const trimmed = line.trim();
          if (trimmed.startsWith("```")) {
            if (inCode) {
              const codeText = codeLines.join("\n");
              const encoded = encodeURIComponent(codeText);
              html.push(`
                <div class="code-card">
                  <div class="code-header">
                    <span>${escapeHtml((codeLang || "code").toUpperCase())}</span>
                    <button class="icon-btn-sm copy-code-btn" data-code="${encoded}" type="button" aria-label="Copy code">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                      </svg>
                    </button>
                  </div>
                  <pre><code>${escapeHtml(codeText)}</code></pre>
                </div>
              `);
              codeLines = [];
              codeLang = "";
              inCode = false;
            } else {
              flushPara();
              if (listType === "ol" && leadingSpaces >= 2) {
                suspendedOlNext = listStart + listItems.length;
              } else if (leadingSpaces < 2) {
                suspendedOlNext = 0;
              }
              flushList();
              inCode = true;
              codeLang = trimmed.slice(3).trim();
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (!trimmed) {
            flushPara();
            let nextNonEmpty = "";
            let nextLeadingSpaces = 0;
            for (let j = i + 1; j < lines.length; j++) {
              if (lines[j].trim()) {
                nextNonEmpty = lines[j].trim();
                nextLeadingSpaces = lines[j].length - lines[j].trimStart().length;
                break;
              }
            }
            if (listType === "ol" && /^\d+\.\s+/.test(nextNonEmpty)) {
              continue;
            }
            if (listType === "ul" && /^[-*+]\s+/.test(nextNonEmpty)) {
              continue;
            }
            if (listType === "ol" && nextLeadingSpaces >= 2) {
              suspendedOlNext = listStart + listItems.length;
            }
            flushList();
          } else if (
            trimmed.includes("|") &&
            i + 1 < lines.length &&
            isTableSeparatorRow(lines[i + 1])
          ) {
            flushPara(); flushList(); suspendedOlNext = 0;
            const headers = parseTableCells(trimmed);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].trim().includes("|")) {
              const rowTrimmed = lines[i].trim();
              if (!isTableSeparatorRow(rowTrimmed)) {
                const cells = parseTableCells(rowTrimmed);
                while (cells.length < headers.length) cells.push("");
                rows.push(cells.slice(0, headers.length));
              }
              i++;
            }
            i--;
            html.push(`
              <div class="md-table-wrap">
                <table class="md-table">
                  <thead><tr>${headers.map(h => `<th>${renderInlineMarkdown(h)}</th>`).join("")}</tr></thead>
                  <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${renderInlineMarkdown(c)}</td>`).join("")}</tr>`).join("")}</tbody>
                </table>
              </div>
            `);
          } else if (/^([-*_])(\s*\1){2,}$/.test(trimmed)) {
            flushPara(); flushList(); suspendedOlNext = 0;
            html.push('<hr class="md-divider" />');
          } else if (trimmed.startsWith("### ")) {
            flushPara(); flushList(); suspendedOlNext = 0;
            html.push(`<h3>${renderInlineMarkdown(trimmed.slice(4))}</h3>`);
          } else if (trimmed.startsWith("## ")) {
            flushPara(); flushList(); suspendedOlNext = 0;
            html.push(`<h2>${renderInlineMarkdown(trimmed.slice(3))}</h2>`);
          } else if (trimmed.startsWith("# ")) {
            flushPara(); flushList(); suspendedOlNext = 0;
            html.push(`<h1>${renderInlineMarkdown(trimmed.slice(2))}</h1>`);
          } else if (trimmed.startsWith("> ")) {
            flushPara(); flushList(); suspendedOlNext = 0;
            html.push(`<blockquote>${renderInlineMarkdown(trimmed.slice(2))}</blockquote>`);
          } else if (/^[-*+]\s+/.test(trimmed)) {
            flushPara();
            if (listType === "ol") {
              suspendedOlNext = leadingSpaces >= 2 ? (listStart + listItems.length) : 0;
              flushList();
            } else if (listType && listType !== "ul") {
              flushList();
            }
            if (leadingSpaces < 2) {
              suspendedOlNext = 0;
            }
            listType = "ul";
            listItems.push(trimmed.replace(/^[-*+]\s+/, ""));
          } else if (/^\d+\.\s+/.test(trimmed)) {
            flushPara();
            const numMatch = trimmed.match(/^(\d+)\./);
            const itemNum = numMatch ? parseInt(numMatch[1], 10) : 1;
            if (listType && listType !== "ol") flushList();
            if (listType !== "ol") {
              listType = "ol";
              listStart = (itemNum === 1 && suspendedOlNext > 1) ? suspendedOlNext : itemNum;
            }
            suspendedOlNext = 0;
            listItems.push(trimmed.replace(/^\d+\.\s+/, ""));
          } else {
            if (listType === "ol" && leadingSpaces >= 2) {
              suspendedOlNext = listStart + listItems.length;
            } else if (leadingSpaces < 2) {
              suspendedOlNext = 0;
            }
            flushList();
            paraLines.push(trimmed);
          }
        }

        if (inCode && codeLines.length) {
          html.push(`<div class="code-card"><pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre></div>`);
        }
        flushPara();
        flushList();
        return `<div class="md-body">${html.join("")}</div>`;
      }

      function stripMarkdownForSpeech(md) {
        return String(md || "")
          .replace(/```[\s\S]*?```/g, " Code snippet omitted. ")
          .replace(/\[([^\]]+)\]\(https?:\/\/[^)]+\)/gi, "$1")
          .replace(/`([^`]+)`/g, "$1")
          .replace(/^#{1,6}\s*/gm, "")
          .replace(/\*\*([^*]+)\*\*/g, "$1")
          .replace(/\*([^*]+)\*/g, "$1")
          .replace(/^[-*+]\s+/gm, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function toggleSpeak(msgId, text) {
        if (!("speechSynthesis" in window)) {
          showToast("Read aloud is not supported on this device.");
          return;
        }
        if (state.speakingMsgId === msgId) {
          window.speechSynthesis.cancel();
          state.speakingMsgId = null;
          render();
          return;
        }
        window.speechSynthesis.cancel();
        const clean = stripMarkdownForSpeech(text);
        if (!clean) return;
        const utter = new SpeechSynthesisUtterance(clean);
        state.speakingMsgId = msgId;
        utter.onend = () => {
          state.speakingMsgId = null;
          render();
        };
        utter.onerror = () => {
          state.speakingMsgId = null;
          render();
        };
        window.speechSynthesis.speak(utter);
        render();
      }

      function stopSpeaking() {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
        state.speakingMsgId = null;
      }

            <summary class="thought-summary ${isThinking ? "active-thinking" : ""}">

        el.appTitle.textContent = (!state.showingSaved && TAB_TITLES[state.activeTab]) ? TAB_TITLES[state.activeTab] : "Luminary";
        el.studioMenuBtn.classList.toggle("accent", state.studioMenuOpen || state.activeTab !== "CHAT");
        el.studioDropdownMenu.classList.toggle("hidden", !state.studioMenuOpen);
        el.studioDropdownMenu.querySelectorAll("[data-tab]").forEach(btn => {
          btn.classList.toggle("active", !state.showingSaved && btn.dataset.tab === state.activeTab);
        });

        if (state.showingSaved || state.activeTab === "CHAT") {
          el.contentInner.classList.remove("hidden");
          el.studioView.classList.add("hidden");
          if (state.showingSaved) {
            renderSavedView();
          } else {
            const thread = getActiveThread();
            if (!thread || (!thread.messages.length && !state.isGenerating)) {
              renderWelcome();
            } else {
              renderChat(thread);
            }
          }
        } else {
          el.contentInner.classList.add("hidden");
          el.studioView.classList.remove("hidden");
          renderActiveStudio();

        renderComposer();

      function deleteThread(threadId) {

      function buildGeminiContents(historyMessages, currentQuestion, currentImage) {
        const valid = [];
        for (const msg of historyMessages) {
          if (!msg.text && !msg.imageBase64) continue;
          const expected = valid.length % 2 === 0 ? "user" : "model";
          if (msg.role === expected) {
            valid.push(msg);
          } else if (msg.role === "user" && valid.length && valid[valid.length - 1].role === "user") {
            valid[valid.length - 1] = msg;
          }
        }
        if (valid.length && valid[valid.length - 1].role === "user") {
          valid.pop();
        }

        const contents = valid.slice(-8).map(m => {
          const parts = [];
          if (m.text) parts.push({ text: m.text });
          return { role: m.role, parts };
        }).filter(c => c.parts.length > 0);

        const userParts = [];
        if (currentImage) {
          userParts.push({ inline_data: { mime_type: currentImage.mimeType, data: currentImage.base64 } });
        }
        userParts.push({ text: currentQuestion });
        contents.push({ role: "user", parts: userParts });
        return contents;
      }

      async function askQuestion(rawQuestion, overrideMode = null, existingAttachment = null, insertUserMsg = true) {
        const attachment = existingAttachment || state.attachedImage;
        const trimmed = (rawQuestion || "").trim();
        if (!trimmed && !attachment) return;

        const effectiveQuestion = trimmed || "What is in this image?";
        if (!hasBridge() && !state.apiKey.trim()) {
          openSettingsModal({ rawQuestion: effectiveQuestion, overrideMode, attachment });
          return;
        }

        if (insertUserMsg) {
          playSendSound();
        }

        const modeId = overrideMode || state.selectedMode;
        if (overrideMode) {
          state.selectedMode = overrideMode;
          localStorage.setItem(STORAGE_MODE, overrideMode);
        }
        const modeObj = getModeObj(modeId);

        if (insertUserMsg) {
          el.questionInput.value = "";
          el.questionInput.style.height = "auto";
          state.attachedImage = null;
        }

        stopSpeaking();
        state.errorState = null;
        state.followUps = [];

        let thread = getActiveThread();
        if (!thread) {
          thread = {
            id: "t_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
            title: effectiveQuestion.slice(0, 72),
            updatedAt: Date.now(),
            messages: []
          };
          state.threads.unshift(thread);
          state.activeThreadId = thread.id;
        } else {
          thread.updatedAt = Date.now();
        }

        const priorMessages = insertUserMsg
          ? thread.messages.slice()
          : (thread.messages.length && thread.messages[thread.messages.length - 1].role === "user"
              ? thread.messages.slice(0, -1)
              : thread.messages.slice());

        if (insertUserMsg) {
          thread.messages.push({
            id: "m_" + Date.now() + "_u",
            role: "user",
            text: effectiveQuestion,
            imageDataUrl: attachment ? attachment.dataUrl : null,
            imageBase64: attachment ? attachment.base64 : null,
            imageMimeType: attachment ? attachment.mimeType : null,
            timestamp: Date.now()
          });
          saveThreads();
        }

        state.isGenerating = true;
        state.streamingText = "";
        state.streamingThoughts = "";
        state.streamingThinkingSec = 0;
        state.streamingModeLabel = modeObj.label;
        state.abortController = new AbortController();
        render();
        scrollToBottom();

        state.lastUsedFallback = false;
        try {
          let result = { answerText: "", thoughtSummary: "", thinkingSeconds: 0 };
          if (hasBridge()) {
            const bridgeAns = await Promise.resolve(
              window.LuminaryNative.ask(effectiveQuestion, modeId)
            );
            result = { answerText: bridgeAns, thoughtSummary: "", thinkingSeconds: 0 };
          } else {
            result = await streamGeminiRest({
              historyMessages: priorMessages,
              question: effectiveQuestion,
              image: attachment,
              modeObj,
              signal: state.abortController.signal,
              onChunk: update => {
                state.streamingText = update.answerText;
                state.streamingThoughts = update.thoughtSummary;
                state.streamingThinkingSec = update.thinkingSeconds;
                const labelEl = document.getElementById("streamingLabel");
                const thoughtsEl = document.getElementById("streamingThoughtsWrap");
                const bodyEl = document.getElementById("streamingBody");
                if (labelEl && bodyEl && thoughtsEl) {
                  labelEl.textContent = update.answerText ? "Writing answer…" : "Thinking…";
                  thoughtsEl.innerHTML = renderThoughtAccordion(
                    update.thoughtSummary,
                    update.thinkingSeconds,
                    !update.answerText
                  );
                  if (update.answerText) {
                    bodyEl.innerHTML = renderMarkdown(update.answerText);
                  }
                } else {
                  render();
                }
                scrollToBottom();
              }
            });
          }

          if (result.answerText && result.answerText.trim()) {
            thread.messages.push({
              id: "m_" + Date.now() + "_m",
              role: "model",
              text: result.answerText,
              thoughts: result.thoughtSummary || "",
              thinkingSeconds: result.thinkingSeconds || 0,
              modeLabel: modeObj.label,
              bookmarked: false,
              timestamp: Date.now()
            });
            thread.updatedAt = Date.now();
            saveThreads();
            state.isGenerating = false;
            state.streamingText = "";
            state.streamingThoughts = "";
            state.streamingThinkingSec = 0;
            state.abortController = null;
            render();
            scrollToBottom();
            if (!state.lastUsedFallback) {
              fetchFollowUps(effectiveQuestion, result.answerText);
            }
          } else {
            throw new Error("The AI returned an empty response. Please try rephrasing your question.");
          }
        } catch (err) {
          if (err.name === "AbortError") {
            if (state.streamingText.trim()) {
              thread.messages.push({
                id: "m_" + Date.now() + "_m",
                role: "model",
                text: state.streamingText,
                thoughts: state.streamingThoughts || "",
                thinkingSeconds: state.streamingThinkingSec || 0,
                modeLabel: modeObj.label,
                bookmarked: false,
                timestamp: Date.now()
              });
              saveThreads();
            }
            state.isGenerating = false;
            state.streamingText = "";
            state.streamingThoughts = "";
            state.streamingThinkingSec = 0;
            state.abortController = null;
            render();
            return;
          }
          state.isGenerating = false;
          state.streamingText = "";
          state.streamingThoughts = "";
          state.streamingThinkingSec = 0;
          state.abortController = null;
          state.errorState = {
            message: err.message || "Unable to get an answer right now. Check your API key and connection.",
            retryQuestion: effectiveQuestion,
            retryImage: attachment || null
          };
          render();
          scrollToBottom();
        }
      }

      function collectGroundingSources(candidate, webSourcesMap, mapSourcesMap) {
        const chunks = candidate?.groundingMetadata?.groundingChunks;
        if (!Array.isArray(chunks)) return;
        for (const ch of chunks) {
          const uri = typeof ch?.web?.uri === "string" ? ch.web.uri.trim() : "";
          if (/^https?:\/\//i.test(uri) && !webSourcesMap.has(uri)) {
            const rawTitle = (ch?.web?.title || uri)
              .replace(/\[/g, "(")
              .replace(/\]/g, ")")
              .replace(/\s+/g, " ")
              .trim();
            webSourcesMap.set(uri, rawTitle || uri);
          }
          if (ch?.maps) {
            const safeTitle = (ch.maps.title || "View on Google Maps")
              .replace(/\[/g, "(")
              .replace(/\]/g, ")")
              .replace(/\s+/g, " ")
              .trim();
            let mUri = typeof ch.maps.uri === "string" ? ch.maps.uri.trim() : "";
            if (!/^https?:\/\//i.test(mUri) && (ch.maps.placeId || safeTitle)) {
              const q = encodeURIComponent(safeTitle || "Place");
              const pid = ch.maps.placeId ? `&query_place_id=${encodeURIComponent(ch.maps.placeId)}` : "";
              mUri = `https://www.google.com/maps/search/?api=1&query=${q}${pid}`;
            }
            if (mUri && !mapSourcesMap.has(mUri)) {
              mapSourcesMap.set(mUri, safeTitle || mUri);
            }
          }
        }
      }

      function formatSourcesMarkdown(webSourcesMap, mapSourcesMap) {
        let out = "";
        if (mapSourcesMap && mapSourcesMap.size > 0) {
          const lines = ["", "", "### Google Maps Places"];
          let count = 0;
          for (const [uri, title] of mapSourcesMap.entries()) {
            if (count >= 6) break;
            lines.push(`- [${title}](${uri})`);
            count++;
          }
          out += lines.join("\n");
        }
        if (webSourcesMap && webSourcesMap.size > 0) {
          const lines = ["", "", "### Sources"];
          let count = 0;
          for (const [uri, title] of webSourcesMap.entries()) {
            if (count >= 6) break;
            lines.push(`- [${title}](${uri})`);
            count++;
          }
          out += lines.join("\n");
        }
        return out;
      }

      async function runSingleStreamAttempt({ model, body, signal, firstTokenTimeoutMs, onChunk }) {
        const key = state.apiKey.trim();
        const attemptController = new AbortController();
        let timedOutFirstToken = false;
        let firstTokenReceived = false;

        const onUserAbort = () => attemptController.abort(signal?.reason || "UserAbort");
        if (signal) {
          if (signal.aborted) throw new DOMException("Aborted", "AbortError");
          signal.addEventListener("abort", onUserAbort, { once: true });
        }

        const firstTokenTimer = setTimeout(() => {
          if (!firstTokenReceived) {
            timedOutFirstToken = true;
            attemptController.abort("FirstTokenTimeout");
          }
        }, firstTokenTimeoutMs);

        const webSourcesMap = new Map();
        const mapSourcesMap = new Map();

        try {
          const streamUrl = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse&key=${encodeURIComponent(key)}`;
          const res = await fetch(streamUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            cache: "no-store",
            body: JSON.stringify(body),
            signal: attemptController.signal
          });

          if (!res.ok) {
            const errJson = await res.json().catch(() => null);
            const msg = errJson?.error?.message || `Gemini API error (${res.status})`;
            const apiErr = new Error(msg);
            apiErr.status = res.status;
            throw apiErr;
          }

          if (!res.body || !res.body.getReader) {
            const unaryUrl = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
            const uRes = await fetch(unaryUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              cache: "no-store",
              body: JSON.stringify(body),
              signal: attemptController.signal
            });
            const data = await uRes.json();
            const candidate = data?.candidates?.[0];
            collectGroundingSources(candidate, webSourcesMap, mapSourcesMap);
            const parts = candidate?.content?.parts || [];
            let thoughts = "";
            let text = "";
            for (const p of parts) {
              if (!p?.text) continue;
              if (p.thought === true) thoughts += p.text;
              else text += p.text;
            }
            if (text || thoughts) {
              firstTokenReceived = true;
              clearTimeout(firstTokenTimer);
              text += formatSourcesMarkdown(webSourcesMap, mapSourcesMap);
              const out = { answerText: text, thoughtSummary: thoughts, thinkingSeconds: thoughts ? 1 : 0 };
              onChunk(out);
              return out;
            }
            return { answerText: "", thoughtSummary: "", thinkingSeconds: 0 };
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";
          let accumulated = "";
          let thoughtAccum = "";
          let thinkingStartMs = 0;
          let thinkingSec = 0;

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith("data:")) continue;
              const payload = trimmed.slice(5).trim();
              if (!payload || payload === "[DONE]") continue;
              try {
                const parsed = JSON.parse(payload);
                const candidate = parsed?.candidates?.[0];
                collectGroundingSources(candidate, webSourcesMap, mapSourcesMap);
                const parts = candidate?.content?.parts || [];
                let gotThought = false;
                let gotAnswer = false;
                for (const p of parts) {
                  if (!p?.text) continue;
                  if (p.thought === true) {
                    thoughtAccum += p.text;
                    gotThought = true;
                  } else {
                    accumulated += p.text;
                    gotAnswer = true;
                  }
                }
                if (gotThought || gotAnswer) {
                  if (!firstTokenReceived) {
                    firstTokenReceived = true;
                    clearTimeout(firstTokenTimer);
                  }
                  if (gotThought && !thinkingStartMs) {
                    thinkingStartMs = Date.now();
                  }
                  if (thinkingStartMs && (!accumulated || gotThought)) {
                    thinkingSec = Math.max(1, Math.round((Date.now() - thinkingStartMs) / 1000));
                  }
                  onChunk({
                    answerText: accumulated,
                    thoughtSummary: thoughtAccum,
                    thinkingSeconds: thinkingSec
                  });
                }
              } catch {
                // Ignore partial SSE JSON fragments
              }
            }
          }
          if (accumulated.trim() && (webSourcesMap.size > 0 || mapSourcesMap.size > 0)) {
            accumulated += formatSourcesMarkdown(webSourcesMap, mapSourcesMap);
            onChunk({
              answerText: accumulated,
              thoughtSummary: thoughtAccum,
              thinkingSeconds: thinkingSec
            });
          }
          return { answerText: accumulated, thoughtSummary: thoughtAccum, thinkingSeconds: thinkingSec };
        } catch (err) {
          if (timedOutFirstToken && !(signal && signal.aborted)) {
            const timeoutErr = new Error("First token timeout");
            timeoutErr.isFirstTokenTimeout = true;
            throw timeoutErr;
          }
          throw err;
        } finally {
          clearTimeout(firstTokenTimer);
          if (signal) signal.removeEventListener("abort", onUserAbort);
        }
      }

      function isQuotaOrBillingError(err) {
        if (!err) return false;
        if (err.status === 429) return true;
        const msg = String(err.message || "");
        return /quota|billing|resource_exhausted|resource exhausted|rate.?limit|limit:\s*0|exceeded/i.test(msg);
      }

      async function streamGeminiRest({ historyMessages, question, image, modeObj, signal, onChunk }) {
        const selectedModel = state.modelName || "gemini-4-hydrogen";
        const baseContents = buildGeminiContents(historyMessages, question, image);
        const nowStr = new Date().toLocaleString(undefined, {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          timeZoneName: "short"
        });
        const buildBody = (targetModel, enableSearch, enableMaps) => {
          const promptText = (enableSearch || enableMaps) ? BASE_SYSTEM_PROMPT : UNGROUNDED_SYSTEM_PROMPT;
          const locHint = state.gpsCoords ? ` | Approx user GPS: ${state.gpsCoords.lat.toFixed(4)}, ${state.gpsCoords.lng.toFixed(4)}` : "";
          const body = {
            system_instruction: {
              parts: [{
                text: `${promptText}\n\nCurrent local date and time: ${nowStr}${locHint}\nResponse style requirement: ${modeObj.instruction}`
              }]
            },
            contents: baseContents
          };
          const tools = [];
          if (enableSearch) tools.push({ google_search: {} });
          if (enableMaps) tools.push({ google_maps: {} });
          if (tools.length) body.tools = tools;
          if (enableMaps && state.gpsCoords) {
            body.toolConfig = {
              retrievalConfig: {
                latLng: { latitude: state.gpsCoords.lat, longitude: state.gpsCoords.lng }
              }
            };
          }
          if (targetModel.startsWith("gemini-4-")) {
            body.generationConfig = {
              thinkingConfig: {
                thinkingLevel: modeObj.id === "DEEP_DIVE" ? "MEDIUM" : "LOW",
                includeThoughts: true
              }
            };
          } else if (targetModel === "gemini-3.8-flash") {
            body.generationConfig = {
              thinkingConfig: {
                thinkingLevel: modeObj.id === "DEEP_DIVE" ? "LOW" : "MINIMAL",
                includeThoughts: true
              }
            };
          }
          return body;
        };

        const primaryTimeout = modeObj.id === "DEEP_DIVE" ? 12000 : 8000;
        const wantSearch = state.useGoogleSearch;
        const wantMaps = state.useGoogleMaps;
        const rawAttempts = [
          { model: selectedModel, googleSearch: wantSearch, googleMaps: wantMaps, timeoutMs: primaryTimeout },
          { model: "gemini-3.8-flash", googleSearch: wantSearch, googleMaps: wantMaps, timeoutMs: 16000 },
          { model: "gemini-3.5-flash-lite", googleSearch: wantSearch, googleMaps: false, timeoutMs: 15000 },
          { model: "gemini-3.5-flash-lite", googleSearch: false, googleMaps: false, timeoutMs: 22000 },
          { model: "gemini-3.8-flash", googleSearch: false, googleMaps: false, timeoutMs: 22000 }
        ];
        const seen = new Set();
        const attempts = rawAttempts.filter(a => {
          const key = `${a.model}:${a.googleSearch}:${a.googleMaps}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });

        let lastErr = null;
        let groundedQuotaFailed = false;

        for (let i = 0; i < attempts.length; i++) {
          const attempt = attempts[i];
          try {
            const resObj = await runSingleStreamAttempt({
              model: attempt.model,
              body: buildBody(attempt.model, attempt.googleSearch, attempt.googleMaps),
              signal,
              firstTokenTimeoutMs: attempt.timeoutMs,
              onChunk
            });
            if (resObj && resObj.answerText && resObj.answerText.trim()) {
              if (i > 0) state.lastUsedFallback = true;
              if (!attempt.googleSearch && !attempt.googleMaps && groundedQuotaFailed) {
                const noted = `${resObj.answerText}\n\n> *Answered without live Search/Maps grounding because grounding quota is currently exceeded.*`;
                const finalOut = { ...resObj, answerText: noted };
                onChunk(finalOut);
                return finalOut;
              }
              return resObj;
            }
          } catch (err) {
            if ((signal && signal.aborted) || (err.name === "AbortError" && !err.isFirstTokenTimeout)) {
              throw err;
            }
            lastErr = err;
            if ((attempt.googleSearch || attempt.googleMaps) && isQuotaOrBillingError(err)) {
              groundedQuotaFailed = true;
            }
          }
        }

        if (isQuotaOrBillingError(lastErr)) {
          throw new Error(
            "Gemini API quota exceeded for this key/project. Please check your plan & billing in Google AI Studio (aistudio.google.com) or wait briefly before retrying."
          );
        }
        throw lastErr || new Error("Unable to get an answer right now.");
      }

      async function fetchFollowUps(question, answer) {
        if (hasBridge() || !state.apiKey.trim()) return;
        try {
          const key = state.apiKey.trim();
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${encodeURIComponent(key)}`;
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                role: "user",
                parts: [{
                  text: `Based on this Q&A, return JSON {"followUps":["...","...","..."]} with 3 short follow-up questions under 9 words each.\nQuestion: ${question}\nAnswer: ${answer.slice(0, 1000)}`
                }]
              }],
              generationConfig: {
                responseMimeType: "application/json"
              }
            })
          });
          if (!res.ok) return;
          const data = await res.json();
          const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.followUps)) {
            state.followUps = parsed.followUps.filter(x => typeof x === "string" && x.trim()).slice(0, 3);
            render();
            scrollToBottom();
          }
        } catch {
          // Non-critical suggestion fetch
        }
      }
