      function attachResizedImageSource(source, width, height) {
        const maxDim = 1280;
        let w = width;
        let h = height;
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(source, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.86);
        state.attachedImage = {
          dataUrl,
          mimeType: "image/jpeg",
          base64: dataUrl.split(",")[1]
        };
        renderComposer();
      }

      function handleImageFileSelected(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => attachResizedImageSource(img, img.width, img.height);
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      }

      function setCameraPreviewState({ live, message }) {
        el.cameraVideo.classList.toggle("hidden", !live);
        el.cameraFallback.classList.toggle("hidden", live);
        el.capturePhotoBtn.classList.toggle("hidden", !live);
        el.flipCameraBtn.classList.toggle("hidden", !live);
        if (message) {
          el.cameraStatusText.textContent = message;
        }
      }

      async function openCameraCapture() {
        el.cameraModal.classList.add("open");
        setCameraPreviewState({ live: false, message: "Starting camera…" });

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setCameraPreviewState({
            live: false,
            message: "Tap below to take a photo with your device camera."
          });
          el.cameraInput.click();
          return;
        }
        try {
          stopCameraStream();
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: cameraFacingMode } },
            audio: false
          });
          el.cameraVideo.srcObject = cameraStream;
          await el.cameraVideo.play().catch(() => {});
          setCameraPreviewState({ live: true, message: "" });
        } catch {
          setCameraPreviewState({
            live: false,
            message: "Live preview is blocked here. Tap Open Device Camera below to take or upload a photo."
          });
        }
      }

        if (delBtn) {

          return;
        }

      el.contentInner.addEventListener("click", e => {
        const modeBtn = e.target.closest("[data-mode]");
        if (modeBtn) {
          selectMode(modeBtn.dataset.mode);
          return;
        }

        const starterBtn = e.target.closest("[data-starter]");
        if (starterBtn) {
          const starter = STARTER_PROMPTS[Number(starterBtn.dataset.starter)];
          if (starter) askQuestion(starter.question, starter.mode);
          return;
        }

        const followUpBtn = e.target.closest("[data-followup]");
        if (followUpBtn) {
          const q = state.followUps[Number(followUpBtn.dataset.followup)];
          if (q) askQuestion(q);
          return;
        }

        const copyCodeBtn = e.target.closest(".copy-code-btn");
        if (copyCodeBtn) {
          navigator.clipboard?.writeText(decodeURIComponent(copyCodeBtn.dataset.code));
          showToast("Code copied to clipboard");
          return;
        }

        const copyMsgBtn = e.target.closest(".copy-msg-btn");
        if (copyMsgBtn) {
          const thread = getActiveThread();
          const msg = thread?.messages.find(m => m.id === copyMsgBtn.dataset.msgId);
          if (msg) {
            navigator.clipboard?.writeText(msg.text);
            showToast("Copied to clipboard");
          }
          return;
        }

        const speakMsgBtn = e.target.closest(".speak-msg-btn");
        if (speakMsgBtn) {
          const thread = getActiveThread();
          const msg = thread?.messages.find(m => m.id === speakMsgBtn.dataset.msgId);
          if (msg) toggleSpeak(msg.id, msg.text);
          return;
        }

        const bookmarkMsgBtn = e.target.closest(".bookmark-msg-btn");
        if (bookmarkMsgBtn) {
          const thread = getActiveThread();
          const msg = thread?.messages.find(m => m.id === bookmarkMsgBtn.dataset.msgId);
          if (msg) {
            msg.bookmarked = !msg.bookmarked;
            saveThreads();
            render();
          }
          return;
        }

        if (e.target.closest("#regenBtn")) {
          const thread = getActiveThread();
          if (!thread) return;
          const lastUser = [...thread.messages].reverse().find(m => m.role === "user");
          if (!lastUser) return;
          if (thread.messages[thread.messages.length - 1]?.role === "model") {
            thread.messages.pop();
            saveThreads();
          }
          const imgObj = lastUser.imageBase64
            ? { dataUrl: lastUser.imageDataUrl, mimeType: lastUser.imageMimeType, base64: lastUser.imageBase64 }
            : null;
          askQuestion(lastUser.text, state.selectedMode, imgObj, false);
          return;
        }

        if (e.target.closest("#retryBtn") && state.errorState) {
          const { retryQuestion, retryImage } = state.errorState;
          askQuestion(retryQuestion, state.selectedMode, retryImage, false);
          return;
        }

        if (e.target.closest("#savedBackBtn")) {
          state.showingSaved = false;
          render();
          return;
        }

        const openSavedBtn = e.target.closest(".open-saved-thread-btn");
        if (openSavedBtn) {
          openThread(openSavedBtn.dataset.threadId);
          return;
        }

        const copySavedBtn = e.target.closest(".copy-saved-btn");
        if (copySavedBtn) {
          const t = state.threads.find(x => x.id === copySavedBtn.dataset.threadId);
          const m = t?.messages.find(x => x.id === copySavedBtn.dataset.msgId);
          if (m) {
            navigator.clipboard?.writeText(m.text);
            showToast("Copied to clipboard");
          }
          return;
        }

        const unbookmarkSavedBtn = e.target.closest(".unbookmark-saved-btn");
        if (unbookmarkSavedBtn) {
          const t = state.threads.find(x => x.id === unbookmarkSavedBtn.dataset.threadId);
          const m = t?.messages.find(x => x.id === unbookmarkSavedBtn.dataset.msgId);
          if (m) {
            m.bookmarked = false;
            saveThreads();
            render();
          }
        }
      });

      // Lightweight persistent SQL engine backed by localStorage tables + live synced threads/messages/creations
      function getSqlTablesMap() {
        const msgRows = [];
        for (const t of state.threads) {
          for (const m of (t.messages || [])) {
            msgRows.push({ id: m.id, threadId: t.id, role: m.role, text: m.text, bookmarked: m.bookmarked ? 1 : 0, timestamp: m.timestamp });
          }
        }
        const threadRows = state.threads.map(t => ({ id: t.id, title: t.title, updatedAt: t.updatedAt, messageCount: (t.messages || []).length }));
        const base = {
          threads: { columns: ["id", "title", "updatedAt", "messageCount"], rows: threadRows, readOnly: true },
          messages: { columns: ["id", "threadId", "role", "text", "bookmarked", "timestamp"], rows: msgRows, readOnly: true },
          creations: { columns: ["id", "type", "title", "prompt", "metadata", "createdAt"], rows: state.creations, readOnly: true }
        };
        for (const [k, v] of Object.entries(state.customSqlTables)) {
          base[k] = v;
        }
        return base;
      }

      function saveCustomSqlTables() {
        try { localStorage.setItem(STORAGE_SQL_TABLES, JSON.stringify(state.customSqlTables)); } catch {}
      }

      function executeBrowserSql(rawSql) {
        const sql = String(rawSql || "").trim().replace(/;+\s*$/, "");
        if (!sql) return { error: "Enter a SQL statement." };
        const tables = getSqlTablesMap();
        const t0 = performance.now();
        try {
          if (/^SHOW\s+TABLES$/i.test(sql)) {
            const rows = Object.entries(tables).map(([name, t]) => [name, t.columns.join(", "), String(t.rows.length)]);
            return { columns: ["table_name", "columns", "row_count"], rows, status: `${rows.length} table(s)` };
          }
          const createMatch = sql.match(/^CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?([a-zA-Z_]\w*)\s*\(([\s\S]+)\)$/i);
          if (createMatch) {
            const name = createMatch[1];
            const cols = createMatch[2].split(",").map(s => s.trim().split(/\s+/)[0].replace(/["`]/g, "")).filter(Boolean);
            if (!state.customSqlTables[name]) {
              state.customSqlTables[name] = { columns: cols, rows: [], readOnly: false };
              saveCustomSqlTables();
            }
            return { columns: [], rows: [], status: `Table '${name}' ready (${cols.join(", ")}).` };
          }
          const dropMatch = sql.match(/^DROP\s+TABLE\s+(?:IF\s+EXISTS\s+)?([a-zA-Z_]\w*)$/i);
          if (dropMatch) {
            const name = dropMatch[1];
            if (tables[name]?.readOnly) throw new Error(`System table '${name}' cannot be dropped.`);
            delete state.customSqlTables[name];
            saveCustomSqlTables();
            return { columns: [], rows: [], status: `Dropped table '${name}'.` };
          }
          const insertMatch = sql.match(/^INSERT\s+INTO\s+([a-zA-Z_]\w*)\s*(?:\(([^)]+)\))?\s*VALUES\s*\(([\s\S]+)\)$/i);
          if (insertMatch) {
            const name = insertMatch[1];
            const tbl = state.customSqlTables[name];
            if (!tbl) throw new Error(`Custom table '${name}' not found. Create it with CREATE TABLE first.`);
            const vals = insertMatch[3].match(/'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|[^,\s]+/g)?.map(v => v.replace(/^['"]|['"]$/g, "")) || [];
            const cols = insertMatch[2] ? insertMatch[2].split(",").map(c => c.trim()) : tbl.columns;
            const rowObj = {};
            if (tbl.columns.includes("id") && !cols.includes("id")) {
              rowObj.id = tbl.rows.length ? Math.max(...tbl.rows.map(r => Number(r.id) || 0)) + 1 : 1;
            }
            cols.forEach((c, idx) => { rowObj[c] = vals[idx] ?? ""; });
            tbl.rows.push(rowObj);
            saveCustomSqlTables();
            return { columns: [], rows: [], status: `Inserted 1 row into '${name}'.` };
          }
          const selectMatch = sql.match(/^SELECT\s+([\s\S]+?)\s+FROM\s+["`]?([a-zA-Z_]\w*)["`]?(?:\s+WHERE\s+([\s\S]+?))?(?:\s+ORDER\s+BY\s+([a-zA-Z_]\w*)(?:\s+(ASC|DESC))?)?(?:\s+LIMIT\s+(\d+))?$/i);
          if (selectMatch) {
            const [, selColsRaw, tblName, whereClause, orderCol, orderDir, limitRaw] = selectMatch;
            const tbl = tables[tblName];
            if (!tbl) throw new Error(`Table '${tblName}' does not exist.`);
            let data = tbl.rows.slice();
            if (whereClause) {
              const eqM = whereClause.match(/^([a-zA-Z_]\w*)\s*=\s*(['"]?)(.+?)\2$/);
              if (eqM) {
                data = data.filter(r => String(r[eqM[1]] ?? "").toLowerCase() === eqM[3].toLowerCase());
              }
            }
            if (orderCol) {
              const desc = String(orderDir || "").toUpperCase() === "DESC";
              data.sort((a, b) => {
                const av = a[orderCol], bv = b[orderCol];
                if (typeof av === "number" && typeof bv === "number") return desc ? bv - av : av - bv;
                return desc ? String(bv ?? "").localeCompare(String(av ?? "")) : String(av ?? "").localeCompare(String(bv ?? ""));
              });
            }
            if (limitRaw) data = data.slice(0, Number(limitRaw));
            if (/COUNT\(\*\)/i.test(selColsRaw)) {
              return { columns: ["count"], rows: [[String(data.length)]], status: `1 row (${Math.round(performance.now() - t0)}ms)` };
            }
            const cols = selColsRaw.trim() === "*"
              ? tbl.columns
              : selColsRaw.split(",").map(s => s.trim().replace(/^.*\s+AS\s+/i, ""));
            const rows = data.map(r => cols.map(c => String(r[c] ?? "")));
            return { columns: cols, rows, status: `${rows.length} row(s) in ${Math.round(performance.now() - t0)}ms` };
          }
          throw new Error("Supported browser SQL: SHOW TABLES, SELECT ... FROM ... [WHERE] [ORDER BY] [LIMIT], CREATE TABLE, INSERT INTO, DROP TABLE.");
        } catch (err) {
          return { error: err.message };
        }
      }

      async function generateVideoInStudio() {
        const key = requireApiKeyOrPrompt(); if (!key) return;
        const s = state.studio;
        if (!s.vidPrompt.trim() && !s.vidSource) { s.vidError = "Enter a prompt or attach a keyframe image."; render(); return; }
        s.vidLoading = true; s.vidError = ""; s.vidStatus = "Submitting to Veo..."; render();
        try {
          const instance = { prompt: s.vidPrompt.trim() || "Smooth cinematic camera motion bringing this scene to life" };
          if (s.vidSource) instance.image = { bytesBase64Encoded: s.vidSource.base64, mimeType: s.vidSource.mimeType };
          const veoModels = ["veo-3.1-generate-preview", "veo-3.0-generate-preview", "veo-2.0-generate-001"];
          let opName = null, usedModel = veoModels[0], lastErr = "";
          for (const vm of veoModels) {
            s.vidStatus = `Submitting to ${vm}...`; render();
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${vm}:predictLongRunning?key=${encodeURIComponent(key)}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ instances: [instance], parameters: { aspectRatio: s.vidAspect } })
            });
            const d = await r.json().catch(() => ({}));
            if (r.ok && d.name) { opName = d.name; usedModel = vm; break; }
            lastErr = d?.error?.message || `Veo API (${r.status})`;
          }
          if (!opName) throw new Error(lastErr);
          let videoUri = null;
          for (let i = 1; i <= 40; i++) {
            await new Promise(res => setTimeout(res, 4000));
            s.vidStatus = `Rendering video with ${usedModel} (${i * 4}s)...`; render();
            const poll = await fetch(`https://generativelanguage.googleapis.com/v1beta/${opName}?key=${encodeURIComponent(key)}`);

            if (!poll.ok) throw new Error(pd?.error?.message || "Polling failed");

            if (pd.done) {
              videoUri = pd?.response?.generateVideoResponse?.generatedSamples?.[0]?.video?.uri;
              break;

          if (!videoUri) throw new Error("Veo did not return a video URL.");
          const sep = videoUri.includes("?") ? "&" : "?";

      let mediaRec = null, recChunks = [], recTimer = null, liveWs = null, liveAudioCtx = null, liveMicStream = null;
      function stopLiveWs() {
        if (liveWs) { try { liveWs.close(); } catch {} liveWs = null; }
        if (liveMicStream) { liveMicStream.getTracks().forEach(t => t.stop()); liveMicStream = null; }

      async function toggleLiveWebSocketVoice() {
        const s = state.studio;
        if (s.liveStatus === "LIVE" || s.liveStatus === "CONNECTING") { stopLiveWs(); render(); return; }
        const key = requireApiKeyOrPrompt(); if (!key) return;
        s.liveStatus = "CONNECTING"; s.liveMessage = "Connecting to Gemini Live..."; render();
        try {
          liveMicStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
          const Ctx = window.AudioContext || window.webkitAudioContext;
          liveAudioCtx = new Ctx({ sampleRate: 16000 });
          const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(key)}`;
          liveWs = new WebSocket(wsUrl);
          liveWs.onopen = () => {
            liveWs.send(JSON.stringify({
              setup: {
                model: "models/gemini-2.5-flash-native-audio-preview-12-2025",
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: s.voiceName } } }
                },
                inputAudioTranscription: {},
                outputAudioTranscription: {}
              }
            }));
            s.liveStatus = "LIVE"; s.liveMessage = "Live voice active — speak anytime"; render();
            const src = liveAudioCtx.createMediaStreamSource(liveMicStream);
            const proc = liveAudioCtx.createScriptProcessor(4096, 1, 1);
            src.connect(proc); proc.connect(liveAudioCtx.destination);
            proc.onaudioprocess = ev => {
              if (!liveWs || liveWs.readyState !== 1) return;
              const f32 = ev.inputBuffer.getChannelData(0);
              const i16 = new Int16Array(f32.length);
              for (let i = 0; i < f32.length; i++) i16[i] = Math.max(-1, Math.min(1, f32[i])) * 32767;
              let bin = ""; const bytes = new Uint8Array(i16.buffer);
              for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
              liveWs.send(JSON.stringify({ realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: btoa(bin) }] } }));
            };
          };
          liveWs.onmessage = async ev => {
            try {
              const raw = ev.data instanceof Blob ? await ev.data.text() : ev.data;
              const msg = JSON.parse(raw);
              const sc = msg.serverContent;
              if (sc?.inputTranscription?.text) { s.liveTranscripts.push({ speaker: "You", text: sc.inputTranscription.text }); render(); }
              if (sc?.outputTranscription?.text) { s.liveTranscripts.push({ speaker: "Luminary", text: sc.outputTranscription.text }); render(); }
              const parts = sc?.modelTurn?.parts || [];
              for (const p of parts) {
                if (p.inlineData?.data && liveAudioCtx) {
                  const bin = atob(p.inlineData.data); const buf = new Int16Array(bin.length / 2);
                  for (let i = 0; i < buf.length; i++) buf[i] = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8);
                  const ab = liveAudioCtx.createBuffer(1, buf.length, 24000);
                  const ch = ab.getChannelData(0);
                  for (let i = 0; i < buf.length; i++) ch[i] = buf[i] / 32768;
                  const bs = liveAudioCtx.createBufferSource(); bs.buffer = ab; bs.connect(liveAudioCtx.destination); bs.start();
                }
              }
            } catch {}
          };
          liveWs.onerror = () => { s.liveStatus = "IDLE"; s.liveMessage = "Live WebSocket unavailable — use Voice Turn below."; stopLiveWs(); render(); };
          liveWs.onclose = () => { if (s.liveStatus === "LIVE") { stopLiveWs(); render(); } };
        } catch (err) {
          stopLiveWs(); s.liveMessage = err.message || "Microphone unavailable."; render();
        }
      }

      async function toggleAudioRecording(onStopped) {
        const s = state.studio;
        if (s.isRecordingAudio && mediaRec) {
          clearInterval(recTimer);
          mediaRec.onstop = () => {
            const blob = new Blob(recChunks, { type: mediaRec.mimeType || "audio/webm" });
            const reader = new FileReader();
            reader.onload = () => {
              const base64 = String(reader.result).split(",")[1];
              onStopped({ name: `Mic (${s.recSeconds}s)`, mimeType: blob.type || "audio/webm", base64 });
            };
            reader.readAsDataURL(blob);
            mediaRec.stream.getTracks().forEach(t => t.stop());
            s.isRecordingAudio = false; render();
          };
          mediaRec.stop();
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recChunks = [];
          mediaRec = new MediaRecorder(stream);
          mediaRec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
          mediaRec.start();
          s.isRecordingAudio = true; s.recSeconds = 0;
          recTimer = setInterval(() => { s.recSeconds++; render(); }, 1000);
          render();
        } catch (err) { s.transcribeErr = err.message; render(); }
      }

      function extractCodeBlock(raw, langs) {
        const trimmed = String(raw || "").trim();
        const pattern = new RegExp("```(?:" + langs.join("|") + ")?\\s*\\n([\\s\\S]*?)```", "i");
        const match = trimmed.match(pattern);
        if (match && match[1]) return match[1].trim();
        const prefix = new RegExp("^```(?:" + langs.join("|") + ")?\\s*", "i");
        return trimmed.replace(prefix, "").replace(/```$/, "").trim();
      }

      function isTransientUtilityFailure(err) {
        if (!err) return false;
        if (err.status === 503 || err.status === 500 || err.status === 429) return true;
        return /high demand|unavailable|overloaded|capacity|try again later|quota|rate.?limit/i.test(String(err.message || ""));
      }

      async function generateUtilityWithFallback({ key, models, bodyBuilder }) {
        const candidates = [...new Set([
          ...(models || []),
          state.modelName,
          "gemini-3.5-flash-lite",
          "gemini-3.8-flash",
          "gemini-4-hydrogen",
          "gemini-4-argon"
        ].filter(Boolean))];

        let lastErr = null;
        let sawTransient = false;

        const runAttempt = async (model) => {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(bodyBuilder(model))
            }
          );
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const e = new Error(data?.error?.message || `Gemini API (${res.status})`);
            e.status = res.status;
            throw e;
          }
          const parts = data?.candidates?.[0]?.content?.parts || [];
          const text = parts.filter(p => p?.text && p.thought !== true).map(p => p.text).join("").trim();
          if (!text) throw new Error("Empty model response.");
          return text;
        };

        for (const model of candidates) {
          try {
            return await runAttempt(model);
          } catch (err) {
            lastErr = err;
            if (isTransientUtilityFailure(err)) sawTransient = true;
          }
        }

        if (sawTransient) {
          await new Promise(r => setTimeout(r, 1100));
          for (const retryModel of ["gemini-3.5-flash-lite", "gemini-3.8-flash"]) {
            try {
              return await runAttempt(retryModel);
            } catch (err) {
              lastErr = err;
            }
          }
        }

        if (isTransientUtilityFailure(lastErr)) {
          throw new Error("Gemini models are temporarily experiencing high demand. Please tap Try again in a moment.");
        }
        throw lastErr || new Error("Request failed.");
      }

          const base64 = dataUrl.split(",")[1];
          const mimeType = f.type || "application/octet-stream";
          if (e.target.id === "imgEditFile") { state.studio.imgSource = { dataUrl, base64, mimeType }; render(); }
          else if (e.target.id === "vidKeyFile") { state.studio.vidSource = { dataUrl, base64, mimeType }; render(); }
          else if (e.target.id === "audioUploadInput") { state.studio.pendingAudio = { name: f.name, base64, mimeType }; render(); }
        };
        reader.readAsDataURL(f);
      });

      el.studioView.addEventListener("click", async e => {
        const s = state.studio;
        const cs = e.target.closest("[data-create-sub]"); if (cs) { s.createSub = cs.dataset.createSub; render(); return; }
        const vs = e.target.closest("[data-voice-sub]"); if (vs) { s.voiceSub = vs.dataset.voiceSub; render(); return; }
        const ia = e.target.closest("[data-img-aspect]"); if (ia) { s.imgAspect = ia.dataset.imgAspect; render(); return; }
        const va = e.target.closest("[data-vid-aspect]"); if (va) { s.vidAspect = va.dataset.vidAspect; render(); return; }
        const vn = e.target.closest("[data-voice-name]"); if (vn) { s.voiceName = vn.dataset.voiceName; render(); return; }
        const tp = e.target.closest("[data-three-preset]"); if (tp) { s.threePrompt = tp.dataset.threePreset; generateThreeInStudio(false); return; }
        const stbl = e.target.closest("[data-sql-table]"); if (stbl) { s.sqlQuery = `SELECT * FROM ${stbl.dataset.sqlTable} LIMIT 30;`; s.sqlResult = executeBrowserSql(s.sqlQuery); render(); return; }
        const ssnip = e.target.closest("[data-sql-snippet]"); if (ssnip) { s.sqlQuery = ssnip.dataset.sqlSnippet; s.sqlResult = executeBrowserSql(s.sqlQuery); render(); return; }

        if (e.target.id === "toggleProImgBtn") { s.imgPro = !s.imgPro; render(); }
        else if (e.target.id === "pickImgEditBtn") document.getElementById("imgEditFile")?.click();
        else if (e.target.id === "clearImgSrcBtn") { s.imgSource = null; render(); }
        else if (e.target.id === "runGenImgBtn") generateImageInStudio();
        else if (e.target.id === "useGenAsEditBtn" && s.imgResult) { s.imgSource = s.imgResult; render(); }
        else if (e.target.id === "animateGenImgBtn" && s.imgResult) { s.vidSource = s.imgResult; s.createSub = "VIDEO"; render(); }
        else if (e.target.id === "pickVidKeyBtn") document.getElementById("vidKeyFile")?.click();
        else if (e.target.id === "clearVidSrcBtn") { s.vidSource = null; render(); }
        else if (e.target.id === "runGenVidBtn") generateVideoInStudio();
        else if (e.target.id === "toggleLiveVoiceBtn") toggleLiveWebSocketVoice();
        else if (e.target.id === "pttVoiceBtn") {
          toggleAudioRecording(async audioObj => {
            const key = requireApiKeyOrPrompt(); if (!key) return;
            s.liveMessage = "Thinking..."; render();
            try {
              const ans = await generateUtilityWithFallback({
                key,
                models: ["gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-4-hydrogen"],
                bodyBuilder: () => ({
                  contents: [{ role: "user", parts: [{ inline_data: { mime_type: audioObj.mimeType, data: audioObj.base64 } }, { text: "Reply conversationally in plain spoken sentences." }] }]
                })
              });
              s.liveTranscripts.push({ speaker: "You", text: "[Voice message]" }, { speaker: "Luminary", text: ans });
              s.liveMessage = "Speaking reply..."; render();
              if ("speechSynthesis" in window) { window.speechSynthesis.cancel(); window.speechSynthesis.speak(new SpeechSynthesisUtterance(ans)); }
            } catch (err) {
              s.liveMessage = err.message || "Voice turn failed.";
              render();
            }
          });
        }
        else if (e.target.id === "recAudioBtn") toggleAudioRecording(obj => { s.pendingAudio = obj; transcribeAudioInStudio(obj); });
        else if (e.target.id === "pickAudioBtn") document.getElementById("audioUploadInput")?.click();
        else if (e.target.id === "runTranscribeBtn" && s.pendingAudio) transcribeAudioInStudio(s.pendingAudio);
        else if (e.target.id === "toggleThreeCodeBtn") { s.threeShowCode = !s.threeShowCode; render(); }
        else if (e.target.id === "genThreeBtn" || e.target.id === "retryThreeBtn") generateThreeInStudio(false);
        else if (e.target.id === "refineThreeBtn") generateThreeInStudio(true);
        else if (e.target.id === "applyThreeCodeBtn") render();
        else if (e.target.id === "runSqlBtn") { s.sqlResult = executeBrowserSql(s.sqlQuery); render(); }
        else if (e.target.id === "genSqlBtn") generateSqlInStudio();
      });

      render();
    })();
  </script>
</body>
</html>
